[package]
name = "rust_lib_cw_tari_ootle"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Pinned to the Ootle release Esmeralda runs (v0.47.0): the transaction encoding changed in v0.48.

anyhow = "1"
borsh = "1.6"
bounded-vec = "0.9.0"
futures = "0.3"
log = "0.4"
ootle_byte_type = "=0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tari_ootle_common_types = "=0.47.0"
tari_ootle_transaction = "=0.47.0"
tari_engine_types = "=0.47.0"
tari_sidechain = "=6.2.0-pre.2"
tari_template_lib = "=0.35.0"
tari_transaction_components = "=6.2.0-pre.2"
flutter_rust_bridge = "=2.11.1"
ootle-rs = "=0.29.0"
tari_common_types = "=6.2.0-pre.2"
tari_ootle_address = "=0.14.0"
tari_crypto = "0.24.1"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_os = "android")'.dependencies]
# Same versions reqwest's TLS stack pulls in; see src/android.rs.
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
